[package]
name = "mona-tui-permissions"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "mona_tui_permissions"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
mona-base = { path = "../mona-base", default-features = false }
mona-core = { path = "../mona-core" }
mona-tui-style = { path = "../mona-tui-style" }
ratatui = "0.30"
serde_json = "1"

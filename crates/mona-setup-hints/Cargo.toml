[package]
name = "mona-setup-hints"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "mona_setup_hints"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
dirs = "5"
mona-build-meta = { path = "../mona-build-meta" }
mona-config-types = { path = "../mona-config-types" }
mona-core = { path = "../mona-core" }
mona-logging = { path = "../mona-logging" }
mona-storage = { path = "../mona-storage" }
mona-terminal-launch = { path = "../mona-terminal-launch" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

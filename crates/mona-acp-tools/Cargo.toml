[package]
name = "mona-acp-tools"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
mona-message-types = { path = "../mona-message-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["process", "io-util", "fs", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

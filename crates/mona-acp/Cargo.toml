[package]
name = "mona-acp"
version = "0.1.0"
edition = "2024"
description = "mona-acp: Monitter-owned ACP stdio server with per-turn Jev routing. Phase 2 of the mona fork."
publish = false

[lib]
name = "mona_acp"
path = "src/lib.rs"

[[bin]]
name = "mona-acp"
path = "src/main.rs"

[dependencies]
mona-jev = { path = "../mona-jev" }
mona-message-types = { path = "../mona-message-types" }
mona-provider-core = { path = "../mona-provider-core" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
